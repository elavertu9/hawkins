<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="960" height="1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2a0606"/>
      <stop offset="55%" stop-color="#110709"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="lines" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="960" height="1200" fill="url(#bg)"/>
  <rect width="960" height="1200" fill="url(#lines)"/>

  <!-- viewfinder corners -->
  <g fill="none" stroke="#ff4040" stroke-width="4" stroke-linecap="square" opacity="0.55">
    <path d="M70 170V70H170"/>
    <path d="M790 70H890V170"/>
    <path d="M890 1030V1130H790"/>
    <path d="M170 1130H70V1030"/>
  </g>

  <!-- MISSING, in neon outline -->
  <g font-family="'Libre Baskerville', Georgia, 'Times New Roman', serif" font-weight="700"
     font-size="124" letter-spacing="10" text-anchor="middle">
    <text x="480" y="600" fill="none" stroke="#ff2a2a" stroke-width="10" opacity="0.6" filter="url(#glow)">MISSING</text>
    <text x="480" y="600" fill="none" stroke="#ff4040" stroke-width="3.5">MISSING</text>
  </g>

  <g font-family="'Courier Prime', 'Courier New', monospace" font-weight="700" text-anchor="middle">
    <text x="480" y="678" font-size="32" letter-spacing="6" fill="#ede6da" opacity="0.85">HAVE YOU SEEN THIS DRINK?</text>
    <text x="480" y="1010" font-size="22" letter-spacing="5" fill="#a8a196" opacity="0.7">PHOTO COMING SOON · HAWKINS, IND.</text>
  </g>
</svg>
